name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          python -m pip install -e ".[dev]"
          version=$(python -c "import sipl; print(sipl.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          pytest
          python conformance/run.py
      - name: Build
        run: python -m build
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} /^\[[0-9]/ {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
