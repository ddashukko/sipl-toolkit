[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-toolkit"
version = "0.4.0"
description = "Інструменти для навчальної мови SIPL: граматика, парсер, AST, інтерпретатор, trace, візуалізація дерев"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["lark>=1.1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sipl = ["grammar/*.lark", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sipl"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "B905"]

[tool.mypy]
python_version = "3.10"
files = ["src/sipl"]
strict = true

[tool.ruff.lint.per-file-ignores]
"src/sipl/visualization/compare.py" = ["E501"]
